<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>ログイン — みろく</title>
  <link rel="stylesheet" href="/css/styles.css" />
</head>
<body>
  <div style="min-height:100vh;display:flex;align-items:center;justify-content:center;padding:var(--space-6);">
    <div class="card elev-md" style="width:100%;max-width:360px;padding:var(--space-6);gap:var(--space-4);">
      <div class="brand-badge" style="margin-bottom:var(--space-2);align-self:flex-start;">
        <svg width="21" height="21" viewBox="0 0 64 64" style="flex:none;"><path d="M32 18c-6-4-14-5-22-4v34c8-1 16 0 22 4V18Z" fill="var(--color-bg)"/><path d="M32 18c6-4 14-5 22-4v34c-8-1-16 0-22 4V18Z" fill="var(--color-bg)" opacity="0.5"/><path d="M27 27l13 7-13 7V27Z" fill="var(--color-accent)"/></svg>
        <span>みろく</span>
      </div>

      <h2 style="font-size:22px;margin-bottom:2px;">ログイン</h2>
      <p class="text-muted" style="font-size:13px;">自分の記録を見るにはログインしてください</p>

      <form id="login-form" style="display:flex;flex-direction:column;gap:var(--space-3);">
        <div class="field">
          <label for="email">メールアドレス</label>
          <input class="input" id="email" name="email" type="email" required autocomplete="email" />
        </div>
        <div class="field">
          <label for="password">パスワード</label>
          <input class="input" id="password" name="password" type="password" required autocomplete="current-password" />
        </div>
        <div id="login-error" class="text-muted" style="font-size:12px;color:#c0392b;display:none;"></div>
        <button class="btn btn-primary" type="submit" style="justify-content:center;">ログイン</button>
      </form>

      <p class="text-muted" style="font-size:13px;text-align:center;margin:0;">
        アカウントをお持ちでない場合は <a href="/signup.html">新規登録</a>
      </p>
    </div>
  </div>

  <script src="/js/api.js"></script>
  <script src="/js/auth-form.js" data-mode="login"></script>
</body>
</html>
