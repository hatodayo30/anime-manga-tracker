<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>マイライブラリ — RecTrack</title>
  <link rel="stylesheet" href="/css/styles.css" />
</head>
<body data-requires-auth="true">
  <div class="app-shell">
    <nav class="sidebar">
      <div class="sidebar-brand">
        <svg width="22" height="22" viewBox="0 0 256 256" fill="none" stroke="currentColor" stroke-width="14" style="color:var(--color-accent)">
          <circle cx="128" cy="128" r="96" />
          <path d="M88 100 L168 100 L108 156 L168 156" stroke-linecap="round" stroke-linejoin="round" />
        </svg>
        <h4>RecTrack</h4>
      </div>
      <a href="/index.html" class="nav-link">
        <svg width="18" height="18" viewBox="0 0 256 256" fill="none" stroke="currentColor" stroke-width="16"><path d="M40 120 128 48l88 72v88a8 8 0 0 1-8 8H48a8 8 0 0 1-8-8Z" stroke-linejoin="round"/><path d="M96 216v-64h64v64"/></svg>
        ホーム
      </a>
      <a href="/search.html" class="nav-link">
        <svg width="18" height="18" viewBox="0 0 256 256" fill="none" stroke="currentColor" stroke-width="16"><circle cx="112" cy="112" r="76"/><line x1="168" y1="168" x2="220" y2="220" stroke-linecap="round"/></svg>
        検索・追加
      </a>
      <a href="/library.html" class="nav-link active">
        <svg width="18" height="18" viewBox="0 0 256 256" fill="none" stroke="currentColor" stroke-width="16"><rect x="44" y="44" width="168" height="168" rx="8"/><line x1="44" y1="92" x2="212" y2="92"/><line x1="100" y1="44" x2="100" y2="212"/></svg>
        マイライブラリ
      </a>
      <div class="seg" id="lang-toggle" style="margin:0 var(--space-2) var(--space-4);">
        <button type="button" class="seg-opt" data-lang="ja">JA</button>
        <button type="button" class="seg-opt" data-lang="en">EN</button>
      </div>
      <div class="sidebar-footer">アニメ・漫画の視聴/読了記録を一元管理</div>
      <div data-auth-slot style="padding:0 var(--space-2);margin-top:var(--space-3);"></div>
    </nav>

    <main class="main has-bottom-nav">
      <div class="screen">
        <h2>マイライブラリ</h2>
        <p class="text-muted" style="margin-bottom:var(--space-6);font-size:13px;">ステータス別に記録を確認</p>

        <div class="seg" id="lib-type-tabs">
          <label class="seg-opt checked"><input type="radio" name="libtype" value="anime" checked />アニメ</label>
          <label class="seg-opt"><input type="radio" name="libtype" value="manga" />漫画</label>
        </div>

        <div class="seg" id="lib-status-tabs">
          <label class="seg-opt"><input type="radio" name="libstatus" /><span class="seg-label"></span></label>
          <label class="seg-opt checked"><input type="radio" name="libstatus" /><span class="seg-label"></span></label>
          <label class="seg-opt"><input type="radio" name="libstatus" /><span class="seg-label"></span></label>
        </div>

        <div id="lib-genre-chips" style="margin-bottom:var(--space-6);"></div>

        <div id="lib-results"></div>
      </div>
    </main>
  </div>

  <nav class="bottom-nav">
    <a href="/index.html" class="bottom-nav-link">
      <svg width="20" height="20" viewBox="0 0 256 256" fill="none" stroke="currentColor" stroke-width="16"><path d="M40 120 128 48l88 72v88a8 8 0 0 1-8 8H48a8 8 0 0 1-8-8Z" stroke-linejoin="round"/><path d="M96 216v-64h64v64"/></svg>
      ホーム
    </a>
    <a href="/search.html" class="bottom-nav-link">
      <svg width="20" height="20" viewBox="0 0 256 256" fill="none" stroke="currentColor" stroke-width="16"><circle cx="112" cy="112" r="76"/><line x1="168" y1="168" x2="220" y2="220" stroke-linecap="round"/></svg>
      検索
    </a>
    <a href="/library.html" class="bottom-nav-link active">
      <svg width="20" height="20" viewBox="0 0 256 256" fill="none" stroke="currentColor" stroke-width="16"><rect x="44" y="44" width="168" height="168" rx="8"/><line x1="44" y1="92" x2="212" y2="92"/><line x1="100" y1="44" x2="100" y2="212"/></svg>
      ライブラリ
    </a>
  </nav>

  <script src="/js/api.js"></script>
  <script src="/js/util.js"></script>
  <script src="/js/auth.js"></script>
  <script src="/js/library.js"></script>
</body>
</html>
