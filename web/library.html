<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>マイライブラリ — みろく</title>
  <link rel="stylesheet" href="/css/styles.css" />
</head>
<body data-requires-auth="true">
  <div class="app-shell">
    <nav class="sidebar">
      <div class="sidebar-brand">
        <div class="brand-badge">

          <span>みろく</span>
        </div>
      </div>
      <a href="/index.html" class="nav-link">
        <svg width="17" height="17" viewBox="0 0 256 256" fill="none" stroke="currentColor" stroke-width="16"><path d="M40 120 128 48l88 72v88a8 8 0 0 1-8 8H48a8 8 0 0 1-8-8Z" stroke-linejoin="round"/><path d="M96 216v-64h64v64"/></svg>
        ホーム
      </a>
      <a href="/search.html" class="nav-link">
        <svg width="17" height="17" viewBox="0 0 256 256" fill="none" stroke="currentColor" stroke-width="16"><circle cx="112" cy="112" r="76"/><line x1="168" y1="168" x2="220" y2="220" stroke-linecap="round"/></svg>
        検索・追加
      </a>
      <a href="/recommend.html" class="nav-link">
        <svg width="17" height="17" viewBox="0 0 256 256" fill="none" stroke="currentColor" stroke-width="16"><path d="M128 40l24 56 60 5-46 40 14 59-52-32-52 32 14-59-46-40 60-5Z" stroke-linejoin="round"/></svg>
        おすすめ
      </a>
      <a href="/library.html" class="nav-link active">
        <svg width="17" height="17" viewBox="0 0 256 256" fill="none" stroke="currentColor" stroke-width="16"><rect x="44" y="44" width="168" height="168" rx="8"/><line x1="44" y1="92" x2="212" y2="92"/><line x1="100" y1="44" x2="100" y2="212"/></svg>
        マイライブラリ
      </a>
      <div class="sidebar-footer">アニメも漫画も、<br />ひとつの記録に。</div>
      <div data-auth-slot style="padding:0 10px;margin-top:var(--space-3);"></div>
    </nav>

    <main class="main has-bottom-nav">
      <div class="screen">
        <div style="display:flex;align-items:center;justify-content:space-between;gap:var(--space-4);margin-bottom:var(--space-6);flex-wrap:wrap;">
          <h2 style="margin:0;">マイライブラリ</h2>
          <div class="seg" id="kind-toggle" style="flex:none;margin-bottom:0;">
            <button type="button" class="seg-opt" data-kind="anime">アニメ</button>
            <button type="button" class="seg-opt" data-kind="manga">漫画</button>
          </div>
        </div>

        <div style="display:flex;gap:var(--space-3);margin-bottom:var(--space-6);flex-wrap:wrap;">
          <div id="lib-stat-cards" style="display:contents;"></div>
          <div class="card elev-sm genre-dist-card">
            <div class="card-meta">ジャンル分布</div>
            <div id="lib-genre-dist"></div>
          </div>
        </div>

        <div class="seg" id="lib-status-tabs" style="width:fit-content;">
          <label class="seg-opt"><input type="radio" name="libstatus" /><span class="seg-label"></span></label>
          <label class="seg-opt"><input type="radio" name="libstatus" /><span class="seg-label"></span></label>
          <label class="seg-opt"><input type="radio" name="libstatus" /><span class="seg-label"></span></label>
        </div>

        <div id="lib-genre-chips" style="margin-bottom:var(--space-6);"></div>

        <div id="lib-results"></div>
      </div>
    </main>
  </div>

  <nav class="bottom-nav">
    <a href="/index.html" class="bottom-nav-link">
      <svg width="20" height="20" viewBox="0 0 256 256" fill="none" stroke="currentColor" stroke-width="16"><path d="M40 120 128 48l88 72v88a8 8 0 0 1-8 8H48a8 8 0 0 1-8-8Z" stroke-linejoin="round"/><path d="M96 216v-64h64v64"/></svg>
      ホーム
    </a>
    <a href="/search.html" class="bottom-nav-link">
      <svg width="20" height="20" viewBox="0 0 256 256" fill="none" stroke="currentColor" stroke-width="16"><circle cx="112" cy="112" r="76"/><line x1="168" y1="168" x2="220" y2="220" stroke-linecap="round"/></svg>
      検索
    </a>
    <a href="/recommend.html" class="bottom-nav-link">
      <svg width="20" height="20" viewBox="0 0 256 256" fill="none" stroke="currentColor" stroke-width="16"><path d="M128 40l24 56 60 5-46 40 14 59-52-32-52 32 14-59-46-40 60-5Z" stroke-linejoin="round"/></svg>
      おすすめ
    </a>
    <a href="/library.html" class="bottom-nav-link active">
      <svg width="20" height="20" viewBox="0 0 256 256" fill="none" stroke="currentColor" stroke-width="16"><rect x="44" y="44" width="168" height="168" rx="8"/><line x1="44" y1="92" x2="212" y2="92"/><line x1="100" y1="44" x2="100" y2="212"/></svg>
      ライブラリ
    </a>
  </nav>

  <script src="/js/api.js"></script>
  <script src="/js/util.js"></script>
  <script src="/js/auth.js"></script>
  <script src="/js/modal.js"></script>
  <script src="/js/library.js"></script>
</body>
</html>
