services:
  app:
    build: .
    restart: unless-stopped
    environment:
      PORT: "8080"
      DATABASE_URL: postgres://anime_manga:anime_manga@postgres:5432/anime_manga_tracker?sslmode=disable
      # 平文HTTPでアクセスするのでCookieの Secure は立てない
      COOKIE_SECURE: "false"
    ports:
      - "8090:8080"
    depends_on:
      postgres:
        condition: service_healthy

  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: anime_manga
      POSTGRES_PASSWORD: anime_manga
      POSTGRES_DB: anime_manga_tracker
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      # マイグレーションは docker-entrypoint-initdb.d ではなくアプリ起動時に適用する
      # （RDS では initdb が使えず、ローカルと本番で経路を分けたくないため）
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U anime_manga -d anime_manga_tracker"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  pgdata:
