services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: anime_manga
      POSTGRES_PASSWORD: anime_manga
      POSTGRES_DB: anime_manga_tracker
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      # 初回起動時にのみ自動実行される（ファイル名の昇順で実行）
      - ./migrations/0001_init.up.sql:/docker-entrypoint-initdb.d/0001_init.sql:ro
      - ./migrations/0002_users.up.sql:/docker-entrypoint-initdb.d/0002_users.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U anime_manga -d anime_manga_tracker"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  pgdata:
